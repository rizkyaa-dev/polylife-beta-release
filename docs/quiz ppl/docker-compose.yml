name: polylife-quiz
services:
  web:
    image: polylife-quiz:local
    build:
      context: ../..
      dockerfile: docs/quiz ppl/Dockerfile
    init: true
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3000'
    environment:
      APP_NAME: PolyLife
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: http://localhost:${APP_PORT:-8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: polylife_quiz
      DB_USERNAME: polylife
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      HASH_DRIVER: bcrypt
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/up']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app_net]
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: polylife_quiz
      MYSQL_USER: polylife
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [app_net]
volumes:
  db_data:
networks:
  app_net:
    driver: bridge
