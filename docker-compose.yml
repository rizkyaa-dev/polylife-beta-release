x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: ${APP_IMAGE:-polylife-app:latest}

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-http://localhost}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-polylife}
  DB_USERNAME: root
  DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
  CACHE_STORE: ${CACHE_STORE:-database}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

services:
  app:
    <<: *app-image
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - polylife

  queue:
    <<: *app-image
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - polylife

  scheduler:
    <<: *app-image
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - polylife

  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-polylife}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polylife

networks:
  polylife:
    driver: bridge

volumes:
  db_data:
    driver: local
